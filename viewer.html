<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Proxy Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>

<body>
  <header class="toolbar">
    <button id="back" type="button" title="Back" aria-label="Back">←</button>
    <button id="forward" type="button" title="Forward" aria-label="Forward">→</button>
    <button id="reload" type="button" title="Reload" aria-label="Reload">↻</button>

    <form id="nav-form">
      <input
        id="address"
        type="text"
        spellcheck="false"
        autocomplete="url"
        placeholder="Enter a website address or search…"
        aria-label="Website address"
      >
      <button type="submit" id="go">Go</button>
    </form>

    <button id="open-tab" type="button" title="Open current page in a new tab" aria-label="Open in new tab">↗</button>
  </header>

  <main>
    <section id="welcome" class="welcome">
      <div class="logo">↗</div>
      <h1>Mini Proxy Viewer</h1>
      <p>Enter a website address or a search to browse through your server.</p>

      <form id="welcome-form">
        <input
          id="welcome-address"
          type="text"
          placeholder="https://example.com"
          spellcheck="false"
          aria-label="Website address"
        >
        <button type="submit">Open website</button>
      </form>

      <p class="note">
        Pages load through your connected server. Complex sites that rely on
        heavy JavaScript, logins or streaming may not work fully.
      </p>
    </section>

    <iframe id="site-frame" title="Website viewer" referrerpolicy="no-referrer"></iframe>
  </main>

  <footer id="status" role="status">Ready</footer>

  <script src="viewer.js"></script>
</body>
</html>
